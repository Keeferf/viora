<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Viora - High-quality screen sharing for teams" />
    <meta name="theme-color" content="#00d9a5" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('viora-settings') || '{}').state?.theme || 'system';
        var e = t === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : t;
        document.documentElement.setAttribute('data-theme', e);
        document.documentElement.style.colorScheme = e;
      } catch {}
    </script>
    <title>Viora - Screen Sharing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
